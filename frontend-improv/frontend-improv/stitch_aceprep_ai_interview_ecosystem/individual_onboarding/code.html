<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>InterviewPro - Onboarding</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        .goal-card input[type="radio"]:checked + div {
            border-color: #4648d4; /* primary */
            background-color: #eff4ff; /* surface-container-low */
        }
        
        .goal-card input[type="radio"]:checked + div .icon-wrapper {
             background-color: #e1e0ff; /* primary-fixed */
             color: #4648d4;
        }

        .goal-card:hover div {
             transform: translateY(-2px);
             box-shadow: 0 10px 15px -3px rgba(70, 72, 212, 0.05), 0 4px 6px -4px rgba(70, 72, 212, 0.05);
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary": "#006c49",
                    "primary-fixed": "#e1e0ff",
                    "primary": "#4648d4",
                    "surface-variant": "#d3e4fe",
                    "on-tertiary-container": "#fffbff",
                    "on-error": "#ffffff",
                    "on-secondary-fixed-variant": "#005236",
                    "surface-container-highest": "#d3e4fe",
                    "on-tertiary": "#ffffff",
                    "secondary-fixed-dim": "#4edea3",
                    "inverse-primary": "#c0c1ff",
                    "on-primary-fixed": "#07006c",
                    "tertiary-fixed-dim": "#ffb95f",
                    "secondary-fixed": "#6ffbbe",
                    "surface-container-lowest": "#ffffff",
                    "secondary-container": "#6cf8bb",
                    "tertiary-fixed": "#ffddb8",
                    "on-secondary": "#ffffff",
                    "outline-variant": "#c7c4d7",
                    "on-surface-variant": "#464554",
                    "inverse-surface": "#213145",
                    "on-secondary-container": "#00714d",
                    "background": "#f8f9ff",
                    "on-secondary-fixed": "#002113",
                    "surface": "#f8f9ff",
                    "surface-container": "#e5eeff",
                    "on-tertiary-fixed-variant": "#653e00",
                    "on-primary-fixed-variant": "#2f2ebe",
                    "surface-container-low": "#eff4ff",
                    "on-background": "#0b1c30",
                    "tertiary": "#825100",
                    "error-container": "#ffdad6",
                    "on-primary-container": "#fffbff",
                    "surface-tint": "#494bd6",
                    "error": "#ba1a1a",
                    "primary-fixed-dim": "#c0c1ff",
                    "surface-dim": "#cbdbf5",
                    "inverse-on-surface": "#eaf1ff",
                    "on-tertiary-fixed": "#2a1700",
                    "on-error-container": "#93000a",
                    "outline": "#767586",
                    "surface-bright": "#f8f9ff",
                    "on-surface": "#0b1c30",
                    "on-primary": "#ffffff",
                    "surface-container-high": "#dce9ff",
                    "tertiary-container": "#a36700",
                    "primary-container": "#6063ee"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "64px",
                    "gutter": "24px",
                    "max-width": "1280px",
                    "margin-mobile": "16px",
                    "base": "8px"
            },
            "fontFamily": {
                    "headline-lg": [
                            "Plus Jakarta Sans"
                    ],
                    "headline-md": [
                            "Plus Jakarta Sans"
                    ],
                    "body-lg": [
                            "Plus Jakarta Sans"
                    ],
                    "display-lg-mobile": [
                            "Plus Jakarta Sans"
                    ],
                    "body-md": [
                            "Plus Jakarta Sans"
                    ],
                    "label-md": [
                            "Plus Jakarta Sans"
                    ],
                    "display-lg": [
                            "Plus Jakarta Sans"
                    ],
                    "label-sm": [
                            "Plus Jakarta Sans"
                    ]
            },
            "fontSize": {
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "fontWeight": "700"
                            }
                    ],
                    "headline-md": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "fontWeight": "700"
                            }
                    ],
                    "body-lg": [
                            "18px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "400"
                            }
                    ],
                    "display-lg-mobile": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "800"
                            }
                    ],
                    "body-md": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ],
                    "label-md": [
                            "14px",
                            {
                                    "lineHeight": "20px",
                                    "letterSpacing": "0.01em",
                                    "fontWeight": "600"
                            }
                    ],
                    "display-lg": [
                            "48px",
                            {
                                    "lineHeight": "56px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "800"
                            }
                    ],
                    "label-sm": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "fontWeight": "700"
                            }
                    ]
            }
          }
        }
      }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Progress Top Bar (Transactional, No global nav) -->
<header class="w-full px-margin-mobile md:px-margin-desktop py-6 sticky top-0 bg-background/80 backdrop-blur-md z-10">
<div class="max-w-[800px] mx-auto flex items-center gap-6">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low text-on-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex-1 flex flex-col gap-2">
<div class="flex justify-between items-end">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Step 1 of 3</span>
<span class="font-label-sm text-label-sm text-primary">Goal Selection</span>
</div>
<!-- Progress Track -->
<div class="h-3 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full w-1/3 transition-all duration-500 ease-out relative overflow-hidden">
<!-- Playful shine effect -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/30 to-transparent -translate-x-full animate-[shimmer_2s_infinite]"></div>
</div>
</div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-12 md:py-24">
<div class="w-full max-w-[800px] mx-auto text-center mb-12">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface mb-4">What's your career goal?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[600px] mx-auto">Let's tailor your InterviewPro journey. Select the primary objective you want to achieve.</p>
</div>
<form class="w-full max-w-[800px] mx-auto" onsubmit="event.preventDefault(); window.location.href='#';">
<!-- Bento-style Grid for Goals -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter mb-16">
<!-- Option 1 -->
<label class="goal-card relative cursor-pointer group">
<input checked="" class="peer sr-only" name="career_goal" type="radio" value="faang"/>
<div class="h-full flex flex-col items-center text-center p-8 rounded-DEFAULT bg-surface-container-lowest border-2 border-surface-container transition-all duration-200 peer-focus-visible:ring-4 peer-focus-visible:ring-primary/20">
<div class="icon-wrapper w-20 h-20 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant mb-6 transition-colors duration-200">
<span class="material-symbols-outlined text-[40px]" data-icon="work" data-weight="fill" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">Land a Job at FAANG</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Intensive prep for top-tier tech companies. Algorithms, data structures, and behavioral.</p>
</div>
</label>
<!-- Option 2 -->
<label class="goal-card relative cursor-pointer group">
<input class="peer sr-only" name="career_goal" type="radio" value="pm"/>
<div class="h-full flex flex-col items-center text-center p-8 rounded-DEFAULT bg-surface-container-lowest border-2 border-surface-container transition-all duration-200 peer-focus-visible:ring-4 peer-focus-visible:ring-primary/20">
<div class="icon-wrapper w-20 h-20 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant mb-6 transition-colors duration-200">
<span class="material-symbols-outlined text-[40px]" data-icon="lightbulb" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">Switch to Product Management</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Focus on product sense, execution, and leadership interviews.</p>
</div>
</label>
<!-- Option 3 -->
<label class="goal-card relative cursor-pointer group">
<input class="peer sr-only" name="career_goal" type="radio" value="system_design"/>
<div class="h-full flex flex-col items-center text-center p-8 rounded-DEFAULT bg-surface-container-lowest border-2 border-surface-container transition-all duration-200 peer-focus-visible:ring-4 peer-focus-visible:ring-primary/20">
<div class="icon-wrapper w-20 h-20 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant mb-6 transition-colors duration-200">
<span class="material-symbols-outlined text-[40px]" data-icon="architecture" data-weight="fill" style="font-variation-settings: 'FILL' 1;">architecture</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">Master System Design</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Deep dive into scalable architectures and complex engineering problems.</p>
</div>
</label>
<!-- Option 4 (General Prep) -->
<label class="goal-card relative cursor-pointer group">
<input class="peer sr-only" name="career_goal" type="radio" value="general"/>
<div class="h-full flex flex-col items-center text-center p-8 rounded-DEFAULT bg-surface-container-lowest border-2 border-surface-container transition-all duration-200 peer-focus-visible:ring-4 peer-focus-visible:ring-primary/20">
<div class="icon-wrapper w-20 h-20 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant mb-6 transition-colors duration-200">
<span class="material-symbols-outlined text-[40px]" data-icon="school" data-weight="fill" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">Level Up Core Skills</h3>
<p class="font-body-md text-body-md text-on-surface-variant">General interview preparation to build confidence and foundations.</p>
</div>
</label>
</div>
<!-- Action Area -->
<div class="flex justify-center border-t border-surface-container-high pt-12">
<button class="group relative px-12 py-4 bg-primary text-on-primary rounded-full font-label-md text-label-md hover:bg-primary/90 transition-all duration-300 hover:scale-[1.02] active:scale-95 shadow-[0_4px_0_0_#2f2ebe] hover:shadow-[0_4px_15px_rgba(70,72,212,0.4),_0_4px_0_0_#2f2ebe] active:translate-y-1 active:shadow-[0_0_0_0_#2f2ebe] flex items-center gap-2 overflow-hidden" type="submit">
<span class="relative z-10">Continue</span>
<span class="material-symbols-outlined relative z-10 transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
<!-- Hover Glow Overlay -->
<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none rounded-full"></div>
</button>
</div>
</form>
</main>
<style>
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
    </style>
</body></html>
