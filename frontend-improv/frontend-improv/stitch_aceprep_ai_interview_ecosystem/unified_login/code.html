<script>
        // DOM Elements
        const tabCandidate = document.getElementById('tab-candidate');
        const tabEmployer = document.getElementById('tab-employer');
        const submitBtn = document.getElementById('submit-btn');
        const inputs = document.querySelectorAll('input[type="email"], input[type="password"]');
        const socialBtns = document.querySelectorAll('[id^="social-"]');
        const links = document.querySelectorAll('#forgot-link, #signup-link');
        const card = document.getElementById('auth-card');

        // Theme Definitions
        const themes = {
            candidate: {
                tabActive: ['text-primary', 'border-primary'],
                tabInactive: ['text-on-surface-variant', 'border-transparent'],
                btnPrimary: ['bg-primary', 'text-on-primary', 'rounded-xl', 'hover:bg-surface-tint'],
                btnPrimaryRemove: ['bg-on-surface', 'text-surface-container-lowest', 'rounded-DEFAULT', 'hover:bg-inverse-surface'],
                inputFocus: ['focus:border-primary', 'focus:ring-primary', 'rounded-xl'],
                inputFocusRemove: ['focus:border-on-surface', 'focus:ring-on-surface', 'rounded-DEFAULT'],
                radiusBase: ['rounded-xl'],
                radiusRemove: ['rounded-DEFAULT'],
                link: ['text-primary'],
                linkRemove: ['text-on-surface']
            },
            employer: {
                tabActive: ['text-on-surface', 'border-on-surface'],
                tabInactive: ['text-on-surface-variant', 'border-transparent'],
                btnPrimary: ['bg-on-surface', 'text-surface-container-lowest', 'rounded-DEFAULT', 'hover:bg-inverse-surface'],
                btnPrimaryRemove: ['bg-primary', 'text-on-primary', 'rounded-xl', 'hover:bg-surface-tint'],
                inputFocus: ['focus:border-on-surface', 'focus:ring-on-surface', 'rounded-DEFAULT'],
                inputFocusRemove: ['focus:border-primary', 'focus:ring-primary', 'rounded-xl'],
                radiusBase: ['rounded-DEFAULT'],
                radiusRemove: ['rounded-xl'],
                link: ['text-on-surface'],
                linkRemove: ['text-primary']
            }
        };

        function switchTheme(role) {
            const activeTheme = themes[role];
            const inactiveRole = role === 'candidate' ? 'employer' : 'candidate';
            
            // Handle Tabs
            if (role === 'candidate') {
                tabCandidate.classList.remove(...themes.candidate.tabInactive, ...themes.employer.tabActive);
                tabCandidate.classList.add(...themes.candidate.tabActive);
                tabCandidate.setAttribute('aria-selected', 'true');

                tabEmployer.classList.remove(...themes.employer.tabActive, ...themes.candidate.tabActive);
                tabEmployer.classList.add(...themes.employer.tabInactive);
                tabEmployer.setAttribute('aria-selected', 'false');
            } else {
                tabEmployer.classList.remove(...themes.employer.tabInactive, ...themes.candidate.tabActive);
                tabEmployer.classList.add(...themes.employer.tabActive);
                tabEmployer.setAttribute('aria-selected', 'true');

                tabCandidate.classList.remove(...themes.candidate.tabActive, ...themes.employer.tabActive);
                tabCandidate.classList.add(...themes.candidate.tabInactive);
                tabCandidate.setAttribute('aria-selected', 'false');
            }

            // Handle Submit Button
            submitBtn.classList.remove(...activeTheme.btnPrimaryRemove);
            submitBtn.classList.add(...activeTheme.btnPrimary);
            
            // Adjust Card Radius for structural tightness on Enterprise
            card.classList.remove(...activeTheme.radiusRemove);
            card.classList.add(...activeTheme.radiusBase);

            // Handle Inputs
            inputs.forEach(input => {
                input.classList.remove(...activeTheme.inputFocusRemove);
                input.classList.add(...activeTheme.inputFocus);
            });

            // Handle Social Buttons
            socialBtns.forEach(btn => {
                btn.classList.remove(...activeTheme.radiusRemove);
                btn.classList.add(...activeTheme.radiusBase);
            });

            // Handle Links
            links.forEach(link => {
                link.classList.remove(...activeTheme.linkRemove);
                link.classList.add(...activeTheme.link);
            });
        }

        // Event Listeners
        tabCandidate.addEventListener('click', () => switchTheme('candidate'));
        tabEmployer.addEventListener('click', () => switchTheme('employer'));
    </script>
