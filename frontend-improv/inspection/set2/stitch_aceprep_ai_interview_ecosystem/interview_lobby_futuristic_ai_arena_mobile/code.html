<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PrepPlay - AI Arena Lobby</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#9cf0ff",
                        "error-container": "#93000a",
                        "secondary-fixed-dim": "#c0c1ff",
                        "on-secondary": "#1000a9",
                        "tertiary-fixed": "#89f5e7",
                        "primary": "#c3f5ff",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "surface": "#0f131d",
                        "surface-tint": "#00daf3",
                        "outline": "#849396",
                        "surface-container": "#1c1f2a",
                        "on-tertiary": "#003732",
                        "on-secondary-fixed": "#07006c",
                        "inverse-on-surface": "#2c303b",
                        "surface-variant": "#313540",
                        "inverse-primary": "#006875",
                        "error": "#ffb4ab",
                        "tertiary-container": "#75e2d4",
                        "surface-container-highest": "#313540",
                        "on-secondary-container": "#b0b2ff",
                        "inverse-surface": "#dfe2f1",
                        "on-error-container": "#ffdad6",
                        "surface-container-low": "#171b26",
                        "surface-container-high": "#262a35",
                        "on-tertiary-container": "#00645c",
                        "on-surface": "#dfe2f1",
                        "outline-variant": "#3b494c",
                        "on-background": "#dfe2f1",
                        "on-primary-fixed": "#001f24",
                        "tertiary": "#93fff0",
                        "on-tertiary-fixed-variant": "#005049",
                        "on-tertiary-fixed": "#00201d",
                        "on-error": "#690005",
                        "surface-bright": "#353944",
                        "secondary-container": "#3131c0",
                        "on-primary-container": "#00626e",
                        "primary-container": "#00e5ff",
                        "secondary": "#c0c1ff",
                        "surface-dim": "#0f131d",
                        "background": "#0f131d",
                        "primary-fixed-dim": "#00daf3",
                        "on-primary-fixed-variant": "#004f58",
                        "secondary-fixed": "#e1e0ff",
                        "surface-container-lowest": "#0a0e18",
                        "tertiary-fixed-dim": "#6bd8cb",
                        "on-surface-variant": "#bac9cc",
                        "on-primary": "#00363d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "container-max": "1440px",
                        "margin": "40px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Geist"],
                        "display-lg": ["Geist"],
                        "headline-lg": ["Geist"],
                        "body-md": ["Inter"],
                        "label-sm": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0B0F19; /* Specific base background from style guidance */
            color: theme('colors.on-background');
        }
        
        .glass-panel {
            background: rgba(31, 38, 51, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid;
            border-image-source: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%);
            border-image-slice: 1;
        }

        .ai-glow {
            box-shadow: 0 0 15px theme('colors.primary-container');
        }

        .arena-grid {
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* Pulse animation for the central visualizer */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px theme('colors.primary-container'); }
            50% { box-shadow: 0 0 30px theme('colors.primary-container'), 0 0 10px theme('colors.primary') inset; }
            100% { box-shadow: 0 0 15px theme('colors.primary-container'); }
        }

        .visualizer-pulse {
            animation: pulseGlow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col font-body-md overflow-hidden relative">
<!-- Animated Background Grid -->
<div class="absolute inset-0 z-0 arena-grid opacity-50"></div>
<!-- Top Nav / Header (Simplified for Mobile Lobby) -->
<header class="relative z-10 flex justify-between items-center w-full px-4 py-4 max-w-max-width mx-auto bg-surface-container-low border-b border-surface-variant">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl">arrow_back</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">PrepPlay</span>
</div>
<div class="flex gap-4">
<span class="material-symbols-outlined text-on-surface-variant">settings</span>
</div>
</header>
<!-- Main Content Area -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-between px-4 py-6 overflow-y-auto">
<!-- Session Info -->
<div class="w-full text-center mb-6">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-1">System Design</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Lobby Environment</p>
</div>
<!-- Central AI Visualizer -->
<div class="flex-1 flex items-center justify-center w-full min-h-[250px] mb-8">
<div class="relative w-48 h-48 rounded-full border border-primary-container bg-surface-container-highest flex items-center justify-center visualizer-pulse">
<!-- Inner Core -->
<div class="w-32 h-32 rounded-full bg-surface border border-primary-fixed-dim flex items-center justify-center relative overflow-hidden">
<!-- Simulated waveform / particles could go here, using a static representation for now -->
<span class="material-symbols-outlined text-primary-container text-6xl opacity-80" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
<!-- Overlay gradient for depth -->
<div class="absolute inset-0 bg-gradient-to-t from-primary-container/20 to-transparent"></div>
</div>
<!-- Orbiting Elements (Decorative) -->
<div class="absolute w-full h-full rounded-full border border-white/10 animate-[spin_10s_linear_infinite]">
<div class="absolute top-0 left-1/2 w-2 h-2 bg-primary rounded-full transform -translate-x-1/2 -translate-y-1/2 shadow-[0_0_5px_#c3f5ff]"></div>
</div>
<div class="absolute w-[120%] h-[120%] rounded-full border border-white/5 animate-[spin_15s_linear_infinite_reverse]">
<div class="absolute bottom-0 right-1/4 w-1.5 h-1.5 bg-tertiary-fixed rounded-full transform translate-x-1/2 translate-y-1/2 shadow-[0_0_5px_#89f5e7]"></div>
</div>
</div>
</div>
<!-- Tech Checks (Stacked for Mobile) -->
<div class="w-full flex flex-col gap-3 mb-8">
<!-- Camera Check -->
<div class="glass-panel rounded-lg p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center border border-white/10">
<span class="material-symbols-outlined text-on-surface">videocam</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-background">Camera</p>
<p class="text-xs text-on-surface-variant">FaceTime HD</p>
</div>
</div>
<div class="flex items-center gap-2 text-primary-container">
<span class="font-label-sm text-label-sm">Ready</span>
<span class="material-symbols-outlined text-sm">check_circle</span>
</div>
</div>
<!-- Microphone Check -->
<div class="glass-panel rounded-lg p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center border border-primary-container ai-glow">
<span class="material-symbols-outlined text-primary-container">mic</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-background">Microphone</p>
<p class="text-xs text-primary-container">External Mic - Active</p>
</div>
</div>
<div class="w-16 h-4 bg-surface-variant rounded-full overflow-hidden flex items-center p-[1px] gap-[1px]">
<!-- Simulated Audio Meter -->
<div class="h-full w-1/5 bg-primary-container opacity-40"></div>
<div class="h-full w-1/5 bg-primary-container opacity-60"></div>
<div class="h-full w-1/5 bg-primary-container opacity-80"></div>
<div class="h-full w-1/5 bg-primary-container"></div>
<div class="h-full w-1/5 bg-surface"></div>
</div>
</div>
<!-- Network Check -->
<div class="glass-panel rounded-lg p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center border border-white/10">
<span class="material-symbols-outlined text-on-surface">wifi</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-background">Connection</p>
<p class="text-xs text-on-surface-variant">Stable - 45ms</p>
</div>
</div>
<div class="flex items-center gap-2 text-primary-container">
<span class="font-label-sm text-label-sm">Good</span>
<span class="material-symbols-outlined text-sm">check_circle</span>
</div>
</div>
</div>
<!-- Action Area -->
<div class="w-full mt-auto pb-4">
<button class="w-full bg-primary-container text-[#001f24] font-bold py-4 rounded-lg hover:shadow-[0_0_20px_theme('colors.primary-container')] transition-all duration-300 flex items-center justify-center gap-2">
                START SESSION
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
</body></html>
